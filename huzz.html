<!DOCTYPE html>
<html>
    <head>
        <title>
            huzz
        </title>
        <script>
            function onClick() {
                var num=prompt("");done=false;x=window.location.href;for (var i=1; i<=num; i++){history.pushState(0, 0, i==num?x:i.toString());if(i==num){done=true}}if(done===true){alert("success! "+window.location.href+" now appears in your history "+num+(num==1?" time.":" times."))}
            };
        </script>
    </head>
    <body>
        <button onclick="onClick()">huzzify</button>
    </body>
</html>
